plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

android {
    namespace 'com.pulsedistrict.music'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pulsedistrict.music'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.0.1'

        // Set this to the deployed HTTPS Flask API URL before making a release build.
        buildConfigField 'String', 'API_BASE_URL', '""'
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../static']
        }
    }
}
